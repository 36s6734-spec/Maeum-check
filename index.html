<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>마음 점검 - 서비스직 스트레스 자가진단</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<style>
:root {
  --p1:#F0E6D8;
  --p2:#D6A6A5;
  --p3:#A99BB8;
  --p4:#27344A;
  --bg:color-mix(in srgb,var(--p1) 10%,#fff);
  --card:#fff;
  --ink:#171717;
  --sub:#716f76;
  --line:color-mix(in srgb,var(--p3) 20%,#fff);
  --pill:#171717;
  --button:var(--p4);
  --button-text:#fff;
  --accent:var(--p2);
  --accent2:var(--p3);
  --white:#fff;
  --black:#000;
}

* { box-sizing:border-box; }

body {
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font:16px/1.55 Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}

.app {
  max-width:1180px;
  margin:0 auto;
  min-height:100vh;
  padding:20px 16px 110px;
}

h1 { font-size:22px; margin:8px 0 4px; }
h2 { font-size:18px; margin:0 0 8px; }
p { margin:0 0 8px; }
.sub { color:var(--sub); font-size:14px; }

.card {
  background:var(--card);
  border-radius:22px;
  padding:18px;
  margin:12px 0;
  box-shadow:0 2px 10px rgba(43,42,51,.06);
}

.big {
  display:flex;
  gap:14px;
  align-items:center;
  text-decoration:none;
  color:inherit;
  cursor:pointer;
  width:100%;
  border:0;
  text-align:left;
  font:inherit;
}

.big svg { flex:none; width:56px; height:56px; }

.grid {
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px;
  margin:14px 0;
}

.opt {
  border:0;
  background:none;
  padding:0;
  text-align:center;
  font:inherit;
  font-size:12px;
  color:var(--sub);
  cursor:pointer;
}

.opt svg {
  width:100%;
  max-width:56px;
  border-radius:50%;
  border:3px solid transparent;
}

.opt.on svg { border-color:var(--ink); }

.chips {
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin:12px 0;
}

.chip {
  border:1.5px solid var(--line);
  background:#fff;
  border-radius:999px;
  padding:9px 14px;
  font:inherit;
  font-size:14px;
  cursor:pointer;
}

.chip.on {
  background:var(--ink);
  color:#fff;
  border-color:var(--ink);
}

.btn {
  border:0;
  border-radius:999px;
  background:var(--ink);
  color:#fff;
  padding:12px 22px;
  font:inherit;
  font-weight:600;
  cursor:pointer;
}

.btn.ghost {
  background:#fff;
  color:var(--ink);
  border:1.5px solid var(--line);
}

.btn:disabled { opacity:.35; cursor:not-allowed; }

.row {
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-top:16px;
}

.bar {
  height:12px;
  border-radius:99px;
  background:var(--line);
  overflow:hidden;
  margin:4px 0 12px;
}

.bar i {
  display:block;
  height:100%;
  border-radius:99px;
  background:var(--pur);
}

.bar.me i { background:var(--ink); }

.lab {
  display:flex;
  justify-content:space-between;
  font-size:14px;
}

.prog {
  height:6px;
  background:var(--line);
  border-radius:99px;
  overflow:hidden;
}

.prog i {
  display:block;
  height:100%;
  background:var(--ink);
}

.notice {
  border-radius:16px;
  padding:12px 14px;
  margin:12px 0;
  font-size:14px;
  background:#fff;
  border:1.5px solid var(--line);
}

.notice.err {
  background:#FFF0F3;
  border-color:var(--pink);
}

.notice.crisis {
  background:#FFF7DB;
  border-color:var(--yel);
}

.src {
  font-size:12px;
  color:var(--sub);
  margin:18px 4px;
}

.nav {
  position:fixed;
  left:50%;
  bottom:18px;
  transform:translateX(-50%);
  display:flex;
  gap:6px;
  background:var(--pill);
  padding:8px;
  border-radius:999px;
}

.nav a {
  color:#C9C7D4;
  text-decoration:none;
  font-size:14px;
  padding:9px 16px;
  border-radius:999px;
}

.nav a.on {
  background:#fff;
  color:var(--ink);
  font-weight:600;
}

a:focus-visible,
button:focus-visible {
  outline:3px solid var(--pur);
  outline-offset:2px;
}

.hl { text-align:center; }
.hl svg { width:96px; height:96px; }

ul { padding-left:18px; margin:6px 0; }

body {
  font-family:"Gowun Dodum",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  line-height:1.65;
}

h1,h2 {
  font-family:"Jua","Gowun Dodum","Malgun Gothic",sans-serif;
  font-weight:400;
}

.ttl {
  text-align:center;
  font-size:36px;
  margin:14px 0 6px;
}

.ctr { text-align:center; }

.ib {
  width:56px;
  height:56px;
  border-radius:50%;
  display:grid;
  place-items:center;
  flex:none;
  color:#2B2A33;
}

.big .ib svg { width:28px; height:28px; }

.nav a {
  display:flex;
  align-items:center;
  gap:6px;
}

.nav svg { width:18px; height:18px; }

.talk { background:#FFFDF3; }
.talk p { line-height:1.85; }

.in { animation:inR .35s ease both; }
.inl { animation:inL .35s ease both; }

@keyframes inR {
  from { opacity:0; transform:translateX(18px); }
  to { opacity:1; transform:none; }
}

@keyframes inL {
  from { opacity:0; transform:translateX(-18px); }
  to { opacity:1; transform:none; }
}

@media (prefers-reduced-motion:reduce) {
  .in,.inl { animation:none; }
}

.kwrap { position:relative; }

.kmap {
  height:340px;
  border-radius:18px;
  overflow:hidden;
  background:#ECEAF4;
}

.kstate {
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  text-align:center;
  padding:18px;
  border-radius:18px;
  background:rgba(246,245,250,.92);
  font-size:14px;
  z-index:5;
}

.kstate.bad { background:#FFF0F3; }
.kstate[hidden] { display:none; }

.plist {
  list-style:none;
  padding:0;
  margin:0;
}

.pl {
  display:block;
  width:100%;
  text-align:left;
  border:0;
  border-bottom:1px solid var(--line);
  background:#fff;
  padding:12px 4px;
  min-height:48px;
  font:inherit;
  cursor:pointer;
}

.pl .sub { display:block; }

details.card summary {
  cursor:pointer;
  font-weight:600;
  min-height:44px;
  display:flex;
  align-items:center;
}

details.card ol {
  padding-left:20px;
  font-size:14px;
}

.sel {
  width:100%;
  min-height:48px;
  border:1.5px solid var(--line);
  border-radius:14px;
  padding:0 12px;
  font:inherit;
  background:#fff;
  margin-bottom:10px;
}

.plist li {
  border-bottom:1px solid var(--line);
  padding-bottom:4px;
}

.plist .pl { border-bottom:0; }

.pl:disabled {
  cursor:default;
  opacity:.75;
}

.tel {
  display:inline-block;
  padding:8px 4px 10px;
  min-height:44px;
  color:var(--ink);
  font-weight:600;
}

.medot {
  width:18px;
  height:18px;
  border-radius:50%;
  background:#FF4D4F;
  border:3px solid #fff;
  box-shadow:0 0 0 6px rgba(255,77,79,.25),0 2px 6px rgba(0,0,0,.3);
}

/* 사용자 선택 컬러 테마 */

body {
  background:var(--bg);
  color:var(--ink);
  transition:background .2s,color .2s;
}

.card {
  background:var(--card);
  border:1px solid color-mix(in srgb,var(--p3) 10%,transparent);
}

.btn {
  background:var(--button);
  color:var(--button-text);
}

.btn.ghost {
  background:var(--card);
  color:var(--ink);
  border-color:var(--line);
}

.chip {
  background:var(--card);
  color:var(--ink);
  border-color:var(--line);
}

.chip.on {
  background:var(--p4);
  color:var(--button-text);
  border-color:var(--p4);
}

.opt.on svg { border-color:var(--p4); }
.bar i { background:var(--p2); }
.bar.me i { background:var(--p4); }
.prog i { background:var(--p3); }

.nav { background:var(--p4); }

.nav a {
  color:color-mix(in srgb,var(--button-text) 72%,transparent);
}

.nav a.on {
  background:#fff;
  color:#000;
}

a:focus-visible,
button:focus-visible {
  outline-color:var(--p3);
}

.notice {
  background:var(--card);
  border-color:var(--line);
}

.notice.err {
  background:color-mix(in srgb,var(--p1) 18%,#fff);
  border-color:var(--p1);
}

.notice.crisis {
  background:color-mix(in srgb,var(--p2) 35%,#fff);
  border-color:var(--p2);
}

.talk {
  background:color-mix(in srgb,var(--p1) 12%,#fff);
}

.kmap {
  background:color-mix(in srgb,var(--p1) 14%,#fff);
}

.kstate {
  background:color-mix(in srgb,var(--bg) 92%,#fff);
}

.pl {
  background:var(--card);
  border-bottom-color:var(--line);
  color:var(--ink);
}

.ib.tone1 { background:var(--p1); }
.ib.tone2 { background:var(--p2); }
.ib.tone3 { background:var(--p3); color:#fff; }
.ib.tone4 { background:var(--p4); color:var(--button-text); }

/* 오른쪽 아래 고정 테마 선택기 */
.theme-launcher {
  position:fixed;
  z-index:30;
  right:max(18px,calc((100vw - 430px)/2 + 18px));
  bottom:88px;
  width:44px;
  height:44px;
  display:grid;
  place-items:center;
  border:1px solid color-mix(in srgb,var(--p3) 35%,transparent);
  border-radius:50%;
  background:var(--card);
  color:var(--ink);
  box-shadow:0 5px 18px rgba(25,28,38,.16);
  cursor:pointer;
}
.theme-launcher svg { width:21px;height:21px; }
.bead-easter-egg{position:fixed;z-index:30;right:max(8px,calc((100vw - 820px)/2 - 122px));bottom:96px;width:38px;height:38px;display:grid;place-items:center;padding:5px;border:1px solid color-mix(in srgb,var(--p3) 18%,transparent);border-radius:50%;background:color-mix(in srgb,var(--card) 92%,transparent);color:var(--sub);box-shadow:0 3px 12px rgba(25,28,38,.09);opacity:.72;cursor:pointer;transition:opacity .18s,transform .18s,box-shadow .18s}
.bead-easter-egg svg{width:27px;height:27px;display:block}
.bead-easter-egg:hover,.bead-easter-egg:focus-visible{opacity:1;transform:scale(1.08);box-shadow:0 5px 16px rgba(25,28,38,.15)}
.bead-easter-egg:focus-visible{outline:3px solid var(--p3);outline-offset:3px}
.theme-launcher:focus-visible { outline:3px solid var(--p3);outline-offset:3px; }

.theme-panel {
  position:fixed;
  z-index:29;
  right:max(18px,calc((100vw - 430px)/2 + 18px));
  bottom:140px;
  width:min(330px,calc(100vw - 36px));
  max-height:min(68vh,560px);
  overflow:auto;
  padding:16px;
  border:1px solid var(--line);
  border-radius:20px;
  background:var(--card);
  color:var(--ink);
  box-shadow:0 12px 36px rgba(25,28,38,.2);
}
.theme-panel[hidden] { display:none; }
.theme-panel-head { display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px; }
.theme-panel-head h2 { margin:0; }
.theme-close { border:0;background:transparent;color:var(--sub);font-size:22px;cursor:pointer;padding:2px 7px; }
.palette-grid { display:grid;gap:9px;margin-top:12px; }
.palette-choice {
  width:100%;text-align:left;border:1.5px solid var(--line);border-radius:14px;
  padding:10px;background:var(--card);color:var(--ink);cursor:pointer;
}
.palette-choice.active { border:2px solid var(--p4);background:color-mix(in srgb,var(--p1) 35%,var(--card)); }
.palette-choice:focus-visible { outline:3px solid var(--p3);outline-offset:2px; }
.palette-name { display:flex;align-items:center;justify-content:space-between;font-size:14px;font-weight:700;margin-bottom:8px; }
.palette-name small { font-size:11px;color:var(--sub);font-weight:400; }
.palette-swatches { display:flex;gap:5px; }
.palette-swatch { min-width:0;flex:1; }
.palette-swatch i { display:block;height:22px;border-radius:6px;border:1px solid rgba(0,0,0,.06); }
/* ===== 반응형 레이아웃: 모바일·태블릿·데스크톱 ===== */
html {
  -webkit-text-size-adjust: 100%;
  scroll-behavior: smooth;
}
body {
  min-width: 320px;
  min-height: 100vh;
}
.app {
  width: min(100% - 40px, 820px);
  max-width: 820px;
  min-height: 100vh;
  padding: 28px 0 120px;
}
#view {
  width: 100%;
  min-width: 0;
}
.card {
  width: 100%;
  padding: clamp(16px, 2.5vw, 24px);
  border-radius: clamp(16px, 2vw, 22px);
}
h1 { font-size: clamp(22px, 3vw, 30px); }
h2 { font-size: clamp(18px, 2.2vw, 22px); }
p, li, button, select { overflow-wrap: anywhere; }
button, a, select { touch-action: manipulation; }
.kmap { height: clamp(300px, 48vw, 480px); }
.theme-launcher { right: 24px; bottom: 96px; }
.theme-panel { right: 24px; bottom: 150px; }
.nav {
  bottom: max(18px, env(safe-area-inset-bottom));
  max-width: calc(100vw - 32px);
  justify-content: center;
}
.nav a { white-space: nowrap; }
.palette-swatches { gap: 7px; }
@media (min-width: 900px) {
  .app { width: min(100% - 64px, 820px); padding-top: 36px; }
  .card { margin: 16px 0; }
  .nav { bottom: 24px; }
  .theme-launcher { right: max(24px, calc((100vw - 820px)/2 - 68px)); }
  .theme-panel { right: max(24px, calc((100vw - 820px)/2 - 68px)); }
}

@media (max-width: 640px) {
  .app {
    width: calc(100% - 28px);
    padding: 18px 0 112px;
  }
  .ttl { font-size: clamp(28px, 8vw, 36px); }
  .grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 12px 8px;
  }
  .opt { font-size: 12px; }
  .opt svg { max-width: 64px; }
  .row { gap: 8px; }
  .row .btn { flex: 1; padding: 12px 14px; }
  .nav {
    left: 12px;
    right: 12px;
    width: auto;
    max-width: none;
    transform: none;
    bottom: max(10px, env(safe-area-inset-bottom));
    gap: 3px;
    padding: 6px;
    justify-content: space-around;
    box-shadow: 0 4px 18px rgba(0,0,0,.16);
  }
  .nav a {
    flex: 1;
    justify-content: center;
    gap: 5px;
    padding: 10px 6px;
    font-size: 13px;
  }
  .nav svg { width: 17px; height: 17px; }
  .theme-launcher { right: 16px; bottom: 82px; width: 42px; height: 42px; }
  .bead-easter-egg{right:66px;bottom:84px;width:34px;height:34px}
  .theme-panel {
    right: 12px;
    bottom: 134px;
    width: min(340px, calc(100vw - 24px));
    max-height: min(65vh, 520px);
  }
  .locrow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .locrow .btn { flex: 0 0 auto; }
  #locmsg { min-width: 0; flex: 1 1 160px; }
  .kmap { height: 320px; }
  .palette-swatch small { font-size: 8px; }
  .palette-swatch b { font-size: 8px; }
}

@media (max-width: 380px) {
  .app { width: calc(100% - 22px); }
  .card { padding: 14px; }
  .grid { gap: 10px 5px; }
  .chip { padding: 8px 11px; font-size: 13px; }
  .nav a { font-size: 12px; padding: 9px 3px; }
  .nav svg { width: 15px; height: 15px; }
  .theme-panel { padding: 13px; }
  .palette-swatches { gap: 4px; }
}

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { transition-duration: .01ms !important; }
}


/* 홈 첫 화면: 세로형 메뉴 카드 3개 */
.home-menu-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: clamp(12px, 2vw, 22px);
  align-items: stretch;
  margin: clamp(28px, 5vw, 48px) 0 24px;
}
.home-menu-card {
  min-width: 0;
  min-height: clamp(330px, 42vw, 430px);
  margin: 0;
  padding: clamp(18px, 2.4vw, 28px) clamp(12px, 1.8vw, 22px);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  gap: 16px;
  text-align: center;
  text-decoration: none;
  color: inherit;
  transition: transform .18s ease, box-shadow .18s ease;
}
.home-menu-card:hover {
  transform: translateY(-5px);
  box-shadow: 0 10px 26px rgba(43,42,51,.12);
}
.home-menu-card .ib {
  width: 66px;
  height: 66px;
  margin: 18px 0 8px;
}
.home-menu-card .ib svg { width: 30px; height: 30px; }
.home-menu-card h2 { margin: 8px 0 0; }
.home-menu-card .sub { max-width: 18ch; line-height: 1.7; }
@media (max-width: 640px) {
  .app { max-width:430px; padding:20px 16px 110px; }
  .home-menu-grid {
    grid-template-columns: 1fr;
    gap: 14px;
    margin-top: 26px;
  }
  .home-menu-card {
    min-height: 104px;
    padding: 16px 18px;
    display: grid;
    grid-template-columns: 54px minmax(0,1fr);
    grid-template-rows: auto auto;
    align-items: center;
    justify-items: start;
    column-gap: 16px;
    row-gap: 3px;
    text-align: left;
  }
  .home-menu-card .ib {
    grid-column: 1;
    grid-row: 1 / span 2;
    width: 54px;
    height: 54px;
    margin: 0;
  }
  .home-menu-card .ib svg { width: 26px; height: 26px; }
  .home-menu-card h2 { grid-column: 2; grid-row: 1; margin: 0; }
  .home-menu-card .sub { grid-column: 2; grid-row: 2; max-width: none; text-align:left; white-space:normal; }
}
@media (max-width: 380px) {
  .home-menu-card { min-height: 92px; }
}


/* 타이포그래피와 카드 안 정보의 정돈 */
.ttl {
  font-size: clamp(44px, 6vw, 58px);
  line-height: 1.15;
  letter-spacing: -.045em;
  margin: 18px 0 12px;
}
.home-menu-card .sub {
  width: 100%;
  max-width: none;
  white-space: nowrap;
  word-break: keep-all;
  font-size: clamp(12px, 1.35vw, 14px);
  letter-spacing: -.025em;
  line-height: 1.5;
}
.home-menu-card { padding-left: 10px; padding-right: 10px; }
/* 홈 메뉴 설명이 카드 밖으로 밀려나지 않도록 줄바꿈과 너비 제한 */
.home-menu-card { width:100%; min-width:0; }
.home-menu-card .sub {
  display:block;
  width:100%;
  min-width:0;
  max-width:100%;
  white-space:normal;
  overflow-wrap:anywhere;
  word-break:keep-all;
  text-align:center;
}
.opt svg { display: block; margin: 0 auto 5px; }
@media (max-width: 640px) {
  .ttl { font-size: clamp(42px, 11vw, 52px); }
  .home-menu-card .sub { font-size: 14px; }
}

/* 마음 풀기 인터랙션 */
.relax-menu{display:grid;gap:12px;margin-top:20px}
.relax-choice{width:100%;display:flex;align-items:center;gap:16px;text-align:left;color:var(--ink);cursor:pointer}
.relax-choice>span:nth-child(2){flex:1 1 0;min-width:0;max-width:100%}
.relax-choice b{display:block;font-size:17px;overflow-wrap:break-word}
.relax-choice small{display:block;color:var(--sub);font-size:13px;margin-top:3px;line-height:1.55;white-space:normal;overflow-wrap:anywhere;word-break:keep-all;max-width:100%}
.relax-emoji{width:54px;height:54px;flex:none;display:grid;place-items:center;border-radius:17px;background:color-mix(in srgb,var(--p1) 45%,#fff);font-size:29px}
.relax-emoji svg{width:27px;height:27px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

function getTheme() {

function applyTheme(id, save=true) {
  const p = PALETTES.find(x => x.id === id) || PALETTES[0];
  const root = document.documentElement;

  p.roles.forEach((c,i) => {
    root.style.setProperty('--p' + (i+1), c);
  });

  // 진단 표정 색상은 팔레트의 명도 순서대로 밝은색에서 어두운색으로 배열
  const toRgb = hex => {
    const h = hex.replace('#','');
    return [0,2,4].map(i => parseInt(h.slice(i,i+2),16));
  };
  const toHex = rgb => '#' + rgb.map(v => Math.round(v).toString(16).padStart(2,'0')).join('');
  const luminance = hex => {
    const [r,g,b] = toRgb(hex).map(v => {
      v /= 255;
      return v <= .04045 ? v/12.92 : Math.pow((v+.055)/1.055,2.4);
    });
    return .2126*r + .7152*g + .0722*b;
  };
  const mix = (a,b,t) => toHex(toRgb(a).map((v,i)=>v+(toRgb(b)[i]-v)*t));
  const stops = [...p.roles].sort((a,b)=>luminance(b)-luminance(a));
  const faceColors = Array.from({length:5},(_,i)=>{
    const pos = i*(stops.length-1)/4;
    const left = Math.floor(pos), right = Math.min(stops.length-1,left+1);
    return mix(stops[left],stops[right],pos-left);
  });
  faceColors.forEach((color,i)=>{
    root.style.setProperty('--face-'+(i+1),color);
    root.style.setProperty('--face-ink-'+(i+1),luminance(color)<.28?'#FFFFFF':'#20202A');
  });

  root.style.setProperty('--button',p.roles[3]);
  root.style.setProperty('--button-text',p.buttonText);
  root.dataset.theme = p.id;

  if(save) {
    try {
      localStorage.setItem('mc.theme',p.id);
    } catch(e) {}
  }

  document.querySelectorAll('.palette-choice[data-theme]').forEach(b => {
    const active = b.dataset.theme === p.id;
    b.classList.toggle('active',active);
    b.setAttribute('aria-pressed',String(active));
  });
}

  function relaxSound(type) {

    const Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx)return;
    const ctx=relaxSound.ctx||(relaxSound.ctx=new Ctx());if(ctx.state==='suspended')ctx.resume();const now=ctx.currentTime;
    const tone=(freq,duration,shape,volume,delay=0)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type=shape;o.frequency.setValueAtTime(freq,now+delay);o.frequency.exponentialRampToValueAtTime(Math.max(35,freq*.52),now+delay+duration);g.gain.setValueAtTime(.0001,now+delay);g.gain.exponentialRampToValueAtTime(volume,now+delay+.006);g.gain.exponentialRampToValueAtTime(.0001,now+delay+duration);o.connect(g);g.connect(ctx.destination);o.start(now+delay);o.stop(now+delay+duration+.01);};
    if(type==='roll'){tone(690,.17,'triangle',.095);tone(1180,.075,'sine',.035,.055);}
    else if(type==='pop'){const len=Math.floor(ctx.sampleRate*.12),buf=ctx.createBuffer(1,len,ctx.sampleRate),d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);const src=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();src.buffer=buf;f.type='lowpass';f.frequency.value=1700;g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.2,now+.006);g.gain.exponentialRampToValueAtTime(.0001,now+.12);src.connect(f);f.connect(g);g.connect(ctx.destination);src.start(now);tone(180,.08,'sine',.12);}
    else if(type==='click'){tone(1450,.045,'square',.075);tone(520,.055,'triangle',.035,.025);}
    else if(type==='thock'){tone(210,.105,'triangle',.14);tone(780,.045,'sine',.025,.015);}
  } catch(e) {}
}

    ok=!!S.e3;

    body=`
      <h2>최근 2주 사이 스스로를 해치고 싶다는 생각이 들었다.</h2>
      <p class="sub">이 답변은 저장하지 않아요.</p>
      <div class="chips">
        ${E3.map(t=>`
          <button type="button"
            class="chip ${S.e3===t?'on':''}"
            data-e3="${esc(t)}">${t}</button>
        `).join('')}
      </div>`;
  }

  V.innerHTML=`
    <div class="prog">
      <i style="width:${(s/(n-1))*100}%"></i>
    </div>
    <div class="card">
      ${body}
      <div class="row">
        <button class="btn ghost" id="pv" ${s?'':'disabled'}>이전</button>
        <button class="btn" id="nx" ${ok?'':'disabled'}>
          ${s===n-1?'결과 확인':'다음'}
        </button>
      </div>
    </div>`;

  V.querySelectorAll('[data-v]').forEach(b=>{
    b.onclick=()=>{
      const q=Q[s];
      S.a[q[0]]=Number(b.dataset.v);
      test();
    };
  });

  V.querySelectorAll('[data-e2]').forEach(b=>{
    b.onclick=()=>{
      const t=b.dataset.e2;
      S.e2=S.e2.includes(t)
        ? S.e2.filter(x=>x!==t)
        : [...S.e2,t];
      test();
    };
  });

  V.querySelectorAll('[data-e3]').forEach(b=>{
    b.onclick=()=>{
      S.e3=b.dataset.e3;
      test();
    };
  });

  document.getElementById('pv').onclick=()=>{
    if(s>0) {
      S.step--;
      test(-1);
    }
  };

  const advance=()=>{
    if(!ok) return;
    if(s<n-1) {
      S.step++;
      test(1);
    }
    else {
      finish();
    }
  };

  document.getElementById('nx').onclick=advance;

  // 선택을 마친 뒤 Enter를 누르면 다음 문항으로 이동
  if(testEnterHandler) document.removeEventListener('keydown',testEnterHandler);
  testEnterHandler=e=>{
    if(e.key!=='Enter'||e.repeat||e.altKey||e.ctrlKey||e.metaKey||e.shiftKey) return;
    const target=e.target;
    if(target && (target.closest('button#nx,button#pv,input,textarea,select,a,[contenteditable="true"]'))) return;
    const next=document.getElementById('nx');
    if(next && !next.disabled) {
      e.preventDefault();
      next.click();
    }
  };
  document.addEventListener('keydown',testEnterHandler);

  if(dir) anim(dir);
}

function finish() {
  const a=S.a;

  const g=k=>Q
    .filter(q=>q[0][0]===k)
    .map(q=>a[q[0]]);

  const A=mean(g('A'));
  const B=mean(g('B'));
  const C=mean(g('C'));

  const st=mean([
    ...g('A'),
    ...g('B'),
    ...g('C')
  ]);

  const lv=st<2?0:st<3?1:st<4?2:3;

  const r={
    t:Date.now(),
    A,B,C,st,lv,
    d1:a.D1,
    d2:a.D2,
    d3:a.D3,
    b3:a.B3,
    a1:a.A1,
    e1:a.E1,
    e2:S.e2
  };

  lastE3=S.e3;

  const h=load();
  h.push(r);
  save(h);

  S=null;
  location.hash='#result';
}

const km=(a,b)=>{
  const t=x=>x*Math.PI/180;
  const u=t(b.lat-a.lat);
  const v=t(b.lng-a.lng);
  const h=Math.sin(u/2)**2+
    Math.cos(t(a.lat))*Math.cos(t(b.lat))*Math.sin(v/2)**2;
  return 12742*Math.asin(Math.sqrt(h));
};

const fmt=d=>d<1
  ?Math.round(d*100)*10+'m'
  :d.toFixed(1)+'km';

function parseRaw(t) {
  const db={};
  let gu='';

  t.split('\n').forEach(line=>{
    const l=line.trim();
    if(!l) return;

    const m=l.match(/^(상담|정신과)\s*:\s*(.*)$/);

    if(!m) {
      gu=l.replace(/\s*\([^)]*\)\s*$/,'').trim();
      db[gu]=db[gu]||[];
      return;
    }

    if(!gu) return;

    let depth=0,current='';
    const parts=[];

    for(const ch of m[2]) {
      if(ch==='(') depth++;
      if(ch===')') depth--;

      if(ch===','&&depth===0) {
        parts.push(current);
        current='';
      }
      else {
        current+=ch;
      }
    }

    parts.push(current);

    parts.forEach(item=>{
      const value=item.trim();
      if(!value) return;

      const match=value.match(/^(.*?)\((.*)\)\s*$/);
      const name=(match?match[1]:value).trim();
      const inside=match?match[2]:'';
      const details=inside.split(',').map(x=>x.trim()).filter(Boolean);

      const tel=details.find(x=>/^[\d-]{7,}$/.test(x))||'';
      const note=details.filter(x=>x!==tel).join(', ');

      if(name) db[gu].push({
        gu,
        kind:m[1],
        name,
        tel,
        note
      });
    });
  });

  return db;
}

const DB=parseRaw(RAW);

function loadKakao() {
  if(kakaoP) return kakaoP;

  kakaoP=new Promise((ok,ng)=>{
    const fin=()=>{
      try {
        kakao.maps.load(ok);
      }
      catch(e) {
        ng(e);
      }
    };

    if(window.kakao&&kakao.maps) {
      fin();
      return;
    }

    const s=document.createElement('script');

    s.src='https://dapi.kakao.com/v2/maps/sdk.js?appkey='+
      encodeURIComponent(javascriptKey)+
      '&libraries=services&autoload=false';

    s.onload=fin;
    s.onerror=()=>{
      s.remove();
      ng(new Error('sdk'));
    };

    document.head.appendChild(s);
  });

  kakaoP.catch(()=>{
    kakaoP=null;
  });

  return kakaoP;
}

const ready=()=>Promise.race([
  loadKakao(),
  new Promise((_,ng)=>
    setTimeout(()=>ng(new Error('timeout')),8000)
  )
]);

const tail=x=>String(x||'').replace(/\D/g,'').slice(-8);
const nm=x=>String(x||'').replace(/\s/g,'').toLowerCase();

const find=(ps,p)=>new Promise(res=>{
  ps.keywordSearch('서울 '+p.gu+' '+p.name,(d,s)=>{
    if(s!==kakao.maps.services.Status.OK) {
      res(null);
      return;
    }

    const h=d.find(r=>
      tail(p.tel).length===8
        ?tail(r.phone)===tail(p.tel)
        :nm(r.place_name)===nm(p.name)&&
         String(r.address_name).includes(p.gu)
    );

    res(h?{
      lat:+h.y,
      lng:+h.x,
      addr:h.road_address_name||h.address_name,
      tel:h.phone||p.tel
    }:null);
  },{size:5});
});

      return;
    }

    msg('내 위치를 확인하는 중이에요…');

    navigator.geolocation.getCurrentPosition(
      async pos=>{
        myPos={
          lat:pos.coords.latitude,
          lng:pos.coords.longitude
        };

        renderList();

        if(ctl) ctl.me();

        if(!demo) await pickGu();

        const pl=items.filter(p=>p.d!=null);

        msg(
          pl.length
            ?'가장 가까운 곳: '+
              pl.reduce((a,p)=>p.d<a.d?p:a).name+
              ' 약 '+fmt(Math.min(...pl.map(p=>p.d)))
            :'내 위치를 찾았어요.'
        );
      },
      err=>msg(
        err.code===1
          ?'위치 사용이 허용되지 않았어요. 브라우저 주소창에서 위치 권한을 허용으로 바꿔 주세요.'
          :err.code===3
            ?'위치를 확인하는 데 시간이 너무 오래 걸렸어요. 다시 눌러 주세요.'
            :'지금은 위치를 확인할 수 없어요. 잠시 뒤 다시 시도해 주세요.'
      ),
      {
        enableHighAccuracy:true,
        timeout:10000,
        maximumAge:60000
      }
    );
  };

  if(!keyOk()) {
    st(
      '지도를 쓰려면 카카오 JavaScript 키 설정이 필요해요. 코드 위쪽의 javascriptKey 값을 바꿔 주세요. (목록은 그대로 볼 수 있어요)',
      1
    );
    return;
  }

  ready().then(()=>{
    const c=$('kakao-map');
    if(!c) return;

    const m=new kakao.maps.Map(c,{
      center:new kakao.maps.LatLng(37.5665,126.9780),
      level:7
    });

    const iw=new kakao.maps.InfoWindow({removable:true});

    let marks=[],bnd=null,meOv=null;

    const show=(p,mk)=>{
      iw.setContent(`
        <div style="padding:8px 10px;font-size:13px;line-height:1.5;min-width:170px">
          <b>${esc(p.name)}</b><br>
          ${p.practice
            ?'가상 연습 위치 · 실제 자료 아님'
            :esc([p.addr||p.address,p.tel].filter(Boolean).join(' · '))
          }
        </div>
      `);

      iw.open(m,mk);
      m.panTo(mk.getPosition());
    };

    const fit=()=>{
      if(!c.isConnected) return;

      m.relayout();

      if(myPos) {
        ctl.me();
      }
      else if(marks.length>1) {
        m.setBounds(bnd,40,40,40,40);
      }
      else if(marks.length===1) {
        m.setCenter(marks[0].getPosition());
        m.setLevel(3);
      }
    };

    ctl={
      set:()=>{
        marks.forEach(k=>k.setMap(null));

        marks=[];
        bnd=new kakao.maps.LatLngBounds();

        items.forEach(p=>{
          if(p.lat==null) return;

          const pos=new kakao.maps.LatLng(p.lat,p.lng);

          bnd.extend(pos);

          const mk=new kakao.maps.Marker({
            map:m,
            position:pos,
            title:p.name
          });

          kakao.maps.event.addListener(mk,'click',()=>{
            show(p,mk);
          });

          p.mk=mk;
          marks.push(mk);
        });

        fit();
      },

      pick:i=>{
        const p=items[i];

        if(p&&p.mk) {
          show(p,p.mk);

          c.scrollIntoView({
            behavior:'smooth',
            block:'center'
          });
        }
      },

      me:()=>{
        const pos=new kakao.maps.LatLng(
          myPos.lat,
          myPos.lng
        );

        if(meOv) meOv.setMap(null);

        meOv=new kakao.maps.CustomOverlay({
          position:pos,
          content:'<div class="medot" title="내 위치"></div>',
          xAnchor:.5,
          yAnchor:.5
        });

        meOv.setMap(m);

        const near=items
          .filter(p=>p.mk&&p.d!=null)
          .sort((a,b)=>a.d-b.d)[0];

        if(near) {
          const bb=new kakao.maps.LatLngBounds();

          bb.extend(pos);
          bb.extend(near.mk.getPosition());

          m.setBounds(bb,60,60,60,60);
        }
        else {
          m.setCenter(pos);
        }
      }
    };

    ctl.set();
    st('');

    if(window.ResizeObserver) {
      kro=new ResizeObserver(()=>{
        if(c.isConnected) m.relayout();
      });

      kro.observe(c);
    }

    setTimeout(fit,450);

  }).catch(()=>{
    st(
      '지도를 불러오지 못했어요. 아래 "지도가 안 보이면 확인해 보세요"를 확인해 주세요. (목록은 그대로 볼 수 있어요)',
      1
    );
  });
}


// 화면 이동
const routes={
  home,
  test,
  result,
  map,
  relax
};

function go() {
  const r=(location.hash||'#home').slice(1);

  (routes[r]||home)();

  document.querySelectorAll('.nav a').forEach(a=>{
    a.classList.toggle('on',a.hash==='#'+r);
  });

  scrollTo(0,0);
  anim(1);
}


// 저장된 테마 자동 적용 및 플로팅 테마 선택기
applyTheme(getTheme(),false);

const themeLauncher=document.getElementById('theme-launcher');
const themePanel=document.getElementById('theme-panel');
const closeThemePanel=()=>{
  themePanel.hidden=true;
  themeLauncher.setAttribute('aria-expanded','false');
};
document.getElementById('bead-easter-egg').addEventListener('click',()=>{
  relaxMode='beads';
  if(location.hash==='#relax') relax();
  else location.hash='relax';
});
themeLauncher.addEventListener('click',()=>{
  const opening=themePanel.hidden;
  themePanel.hidden=!opening;
  themeLauncher.setAttribute('aria-expanded',String(opening));
});
document.getElementById('theme-close').addEventListener('click',closeThemePanel);
// 각 팔레트 버튼에 직접 이벤트를 연결해 클릭 대상에 관계없이 전환되도록 처리
themePanel.querySelectorAll('.palette-choice[data-theme]').forEach(choice=>{
  choice.addEventListener('click',e=>{
    e.preventDefault();
    e.stopPropagation();
    applyTheme(choice.dataset.theme);
    closeThemePanel();
  });
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!themePanel.hidden) closeThemePanel();
});
document.addEventListener('click',e=>{
  if(!themePanel.hidden&&!themePanel.contains(e.target)&&!themeLauncher.contains(e.target)){
    closeThemePanel();
  }
});

addEventListener('hashchange',go);


// 통계 데이터 적용
try {
  stats=DATA;

  const m=stats.stress.meta;
  const e=stats.effort.meta;

  document.getElementById('src').textContent=
    '평가 기준과 통계 출처는 결과 화면의 + 안내에서 확인할 수 있어요.';
}
catch(x) {

  e.hidden=false;

  e.textContent=
    '통계 데이터를 불러오지 못했어요. 코드의 DATA 부분이 손상되지 않았는지 확인해 주세요. 자가진단과 채점은 계속 쓸 수 있어요.';
}


// 하단 메뉴
document.querySelector('.nav').innerHTML=[
  ['home','홈'],
  ['test','진단'],
  ['result','결과'],
  ['map','지도'],
  ['relax','마음 풀기']
].map(([k,t])=>
  `<a href="#${k}">${ico(k)}<span>${t}</span></a>`
).join('');

go();
