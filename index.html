<style>

  --p1:#F0E6D8;
  --p2:#D6A6A5;
  --p3:#A99BB8;
  --p4:#27344A;
  --bg:color-mix(in srgb,var(--p1) 10%,#fff);
  --card:#fff;
  --ink:#171717;
  --sub:#716f76;
  --line:color-mix(in srgb,var(--p3) 20%,#fff);
  --pill:#171717;
  --button:var(--p4);
  --button-text:#fff;
  --accent:var(--p2);
  --accent2:var(--p3);
  --white:#fff;
  --black:#000;
}

* { box-sizing:border-box; }

body {
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font:16px/1.55 Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}

.app {
  max-width:430px;
  margin:0 auto;
  min-height:100vh;
  padding:20px 16px 110px;
}

h1 { font-size:22px; margin:8px 0 4px; }
h2 { font-size:18px; margin:0 0 8px; }
p { margin:0 0 8px; }
.sub { color:var(--sub); font-size:14px; }

.card {
  background:var(--card);
  border-radius:22px;
  padding:18px;
  margin:12px 0;
  box-shadow:0 2px 10px rgba(43,42,51,.06);
}

.big {
  display:flex;
  gap:14px;
  align-items:center;
  text-decoration:none;
  color:inherit;
  cursor:pointer;
  width:100%;
  border:0;
  text-align:left;
  font:inherit;
}

.big svg { flex:none; width:56px; height:56px; }

.grid {
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px;
  margin:14px 0;
}

.opt {
  border:0;
  background:none;
  padding:0;
  text-align:center;
  font:inherit;
  font-size:12px;
  color:var(--sub);
  cursor:pointer;
}

.opt svg {
  width:100%;
  max-width:56px;
  border-radius:50%;
  border:3px solid transparent;
}

.opt.on svg { border-color:var(--ink); }

.chips {
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin:12px 0;
}

.chip {
  border:1.5px solid var(--line);
  background:#fff;
  border-radius:999px;
  padding:9px 14px;
  font:inherit;
  font-size:14px;
  cursor:pointer;
}

.chip.on {
  background:var(--ink);
  color:#fff;
  border-color:var(--ink);
}

.btn {
  border:0;
  border-radius:999px;
  background:var(--ink);
  color:#fff;
  padding:12px 22px;
  font:inherit;
  font-weight:600;
  cursor:pointer;
}

.btn.ghost {
  background:#fff;
  color:var(--ink);
  border:1.5px solid var(--line);
}

.btn:disabled { opacity:.35; cursor:not-allowed; }

.row {
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-top:16px;
}

.bar {
  height:12px;
  border-radius:99px;
  background:var(--line);
  overflow:hidden;
  margin:4px 0 12px;
}

.bar i {
  display:block;
  height:100%;
  border-radius:99px;
  background:var(--pur);
}

.bar.me i { background:var(--ink); }

.lab {
  display:flex;
  justify-content:space-between;
  font-size:14px;
}

.prog {
  height:6px;
  background:var(--line);
  border-radius:99px;
  overflow:hidden;
}

.prog i {
  display:block;
  height:100%;
  background:var(--ink);
}

.notice {
  border-radius:16px;
  padding:12px 14px;
  margin:12px 0;
  font-size:14px;
  background:#fff;
  border:1.5px solid var(--line);
}

.notice.err {
  background:#FFF0F3;
  border-color:var(--pink);
}

.notice.crisis {
  background:#FFF7DB;
  border-color:var(--yel);
}

.src {
  font-size:12px;
  color:var(--sub);
  margin:18px 4px;
}

.nav {
  position:fixed;
  left:50%;
  bottom:18px;
  transform:translateX(-50%);
  display:flex;
  gap:6px;
  background:var(--pill);
  padding:8px;
  border-radius:999px;
}

.nav a {
  color:#C9C7D4;
  text-decoration:none;
  font-size:14px;
  padding:9px 16px;
  border-radius:999px;
}

.nav a.on {
  background:#fff;
  color:var(--ink);
  font-weight:600;
}

a:focus-visible,
button:focus-visible {
  outline:3px solid var(--pur);
  outline-offset:2px;
}

.hl { text-align:center; }
.hl svg { width:96px; height:96px; }

ul { padding-left:18px; margin:6px 0; }

body {
  font-family:"Gowun Dodum",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  line-height:1.65;
}

h1,h2 {
  font-family:"Jua","Gowun Dodum","Malgun Gothic",sans-serif;
  font-weight:400;
}

.ttl {
  text-align:center;
  font-size:36px;
  margin:14px 0 6px;
}

.ctr { text-align:center; }

.ib {
  width:56px;
  height:56px;
  border-radius:50%;
  display:grid;
  place-items:center;
  flex:none;
  color:#2B2A33;
}

.big .ib svg { width:28px; height:28px; }

.nav a {
  display:flex;
  align-items:center;
  gap:6px;
}

.nav svg { width:18px; height:18px; }

.talk { background:#FFFDF3; }
.talk p { line-height:1.85; }

.in { animation:inR .35s ease both; }
.inl { animation:inL .35s ease both; }

@keyframes inR {
  from { opacity:0; transform:translateX(18px); }
  to { opacity:1; transform:none; }
}

@keyframes inL {
  from { opacity:0; transform:translateX(-18px); }
  to { opacity:1; transform:none; }
}

@media (prefers-reduced-motion:reduce) {
  .in,.inl { animation:none; }
}

.kwrap { position:relative; }

.kmap {
  height:340px;
  border-radius:18px;
  overflow:hidden;
  background:#ECEAF4;
}

.kstate {
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  text-align:center;
  padding:18px;
  border-radius:18px;
  background:rgba(246,245,250,.92);
  font-size:14px;
  z-index:5;
}

.kstate.bad { background:#FFF0F3; }
.kstate[hidden] { display:none; }

.plist {
  list-style:none;
  padding:0;
  margin:0;
}

.pl {
  display:block;
  width:100%;
  text-align:left;
  border:0;
  border-bottom:1px solid var(--line);
  background:#fff;
  padding:12px 4px;
  min-height:48px;
  font:inherit;
  cursor:pointer;
}

.pl .sub { display:block; }

details.card summary {
  cursor:pointer;
  font-weight:600;
  min-height:44px;
  display:flex;
  align-items:center;
}

details.card ol {
  padding-left:20px;
  font-size:14px;
}

.sel {
  width:100%;
  min-height:48px;
  border:1.5px solid var(--line);
  border-radius:14px;
  padding:0 12px;
  font:inherit;
  background:#fff;
  margin-bottom:10px;
}

.plist li {
  border-bottom:1px solid var(--line);
  padding-bottom:4px;
}

.plist .pl { border-bottom:0; }

.pl:disabled {
  cursor:default;
  opacity:.75;
}

.tel {
  display:inline-block;
  padding:8px 4px 10px;
  min-height:44px;
  color:var(--ink);
  font-weight:600;
}

.medot {
  width:18px;
  height:18px;
  border-radius:50%;
  background:#FF4D4F;
  border:3px solid #fff;
  box-shadow:0 0 0 6px rgba(255,77,79,.25),0 2px 6px rgba(0,0,0,.3);
}

body {
  background:var(--bg);
  color:var(--ink);

}

.card {
  background:var(--card);

}

.btn {
  background:var(--button);

.btn.ghost {

.notice {

.kmap {

.kstate {

.pl {

.ib.tone1 { background:var(--p1); }

.ib.tone3 { background:var(--p3); color:#fff; }
.ib.tone4 { background:var(--p4); color:var(--button-text); }

.theme-launcher {
  position:fixed;
  z-index:30;
  right:max(18px,calc((100vw - 430px)/2 + 18px));

.theme-panel {
  position:fixed;
  z-index:29;

  bottom:140px;
  width:min(330px,calc(100vw - 36px));
  max-height:min(68vh,560px);
  overflow:auto;
  padding:16px;
  border:1px solid var(--line);
  border-radius:20px;
  background:var(--card);
  color:var(--ink);

.theme-panel[hidden] { display:none; }
.theme-panel-head { display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px; }
.theme-panel-head h2 { margin:0; }
.theme-close { border:0;background:transparent;color:var(--sub);font-size:22px;cursor:pointer;padding:2px 7px; }
.palette-grid { display:grid;gap:9px;margin-top:12px; }
.palette-choice {
  width:100%;text-align:left;border:1.5px solid var(--line);border-radius:14px;
  padding:10px;background:var(--card);color:var(--ink);cursor:pointer;
}
.palette-choice.active { border:2px solid var(--p4);background:color-mix(in srgb,var(--p1) 35%,var(--card)); }
.palette-choice:focus-visible { outline:3px solid var(--p3);outline-offset:2px; }
.palette-name { display:flex;align-items:center;justify-content:space-between;font-size:14px;font-weight:700;margin-bottom:8px; }
.palette-name small { font-size:11px;color:var(--sub);font-weight:400; }
.palette-swatches { display:flex;gap:5px; }
.palette-swatch { min-width:0;flex:1; }
.palette-swatch i { display:block;height:22px;border-radius:6px;border:1px solid rgba(0,0,0,.06); }
.palette-swatch small { display:block;font-size:9px;line-height:1.25;color:var(--sub);margin-top:4px;overflow-wrap:anywhere; }
.palette-swatch b { display:block;font-size:9px;font-weight:500;color:var(--ink); }
</style>
</head>

function applyTheme(id, save=true) {
  const p = PALETTES.find(x => x.id === id) || PALETTES[0];
  const root = document.documentElement;

  p.roles.forEach((c,i) => {
    root.style.setProperty('--p' + (i+1), c);
  });

  root.style.setProperty('--button',p.roles[3]);
  root.style.setProperty('--button-text',p.buttonText);
  root.dataset.theme = p.id;

  if(save) {
    try {
      localStorage.setItem('mc.theme',p.id);
    } catch(e) {}
  }

  document.querySelectorAll('.palette-choice[data-theme]').forEach(b => {
    const active = b.dataset.theme === p.id;
    b.classList.toggle('active',active);
    b.setAttribute('aria-pressed',String(active));
  });
}

  function test(dir) {
  if(!S) S={step:0,a:{},e2:[],e3:''};

  const n=Q.length+2;
  const s=S.step;
  let body,ok;

  if(s<Q.length) {
    const q=Q[s];
    ok=!!S.a[q[0]];

    body=`
      <p class="sub">${q[1]}</p>
      <h2>${q[2]}</h2>
      <div class="grid">
        ${SCALE.map((t,i)=>`
          <button type="button"
            class="opt ${S.a[q[0]]===i+1?'on':''}"
            data-v="${i+1}">
            ${face(i,i)}
            <span>${t}</span>
          </button>
        `).join('')}
      </div>`;
  }
  else if(s===Q.length) {
    ok=S.e2.length>0;

    body=`
      <h2>지금 가장 필요한 도움은?</h2>
      <p class="sub">여러 개 고를 수 있어요.</p>
      <div class="chips">
        ${E2.map(t=>`
          <button type="button"
            class="chip ${S.e2.includes(t)?'on':''}"
            data-e2="${esc(t)}">${t}</button>
        `).join('')}
      </div>`;
  }
  else {
    ok=!!S.e3;

    body=`
      <h2>최근 2주 사이 스스로를 해치고 싶다는 생각이 들었다.</h2>
      <p class="sub">이 답변은 저장하지 않아요.</p>
      <div class="chips">
        ${E3.map(t=>`
          <button type="button"
            class="chip ${S.e3===t?'on':''}"
            data-e3="${esc(t)}">${t}</button>
        `).join('')}
      </div>`;
  }

  V.innerHTML=`
    <div class="prog">
      <i style="width:${(s/(n-1))*100}%"></i>
    </div>
    <div class="card">
      ${body}
      <div class="row">
        <button class="btn ghost" id="pv" ${s?'':'disabled'}>이전</button>
        <button class="btn" id="nx" ${ok?'':'disabled'}>
          ${s===n-1?'결과 확인':'다음'}
        </button>
      </div>
    </div>`;

  V.querySelectorAll('[data-v]').forEach(b=>{
    b.onclick=()=>{
      const q=Q[s];
      S.a[q[0]]=Number(b.dataset.v);
      test();
    };
  });

  V.querySelectorAll('[data-e2]').forEach(b=>{
    b.onclick=()=>{
      const t=b.dataset.e2;
      S.e2=S.e2.includes(t)
        ? S.e2.filter(x=>x!==t)
        : [...S.e2,t];
      test();
    };
  });

  V.querySelectorAll('[data-e3]').forEach(b=>{
    b.onclick=()=>{
      S.e3=b.dataset.e3;
      test();
    };
  });

  document.getElementById('pv').onclick=()=>{
    if(s>0) {
      S.step--;
      test(-1);
    }
  };

  document.getElementById('nx').onclick=()=>{
    if(!ok) return;

    if(s<n-1) {
      S.step++;
      test(1);
    }
    else {
      finish();
    }
  };

  if(dir) anim(dir);
}

function finish() {
  const a=S.a;

  const g=k=>Q
    .filter(q=>q[0][0]===k)
    .map(q=>a[q[0]]);

  const A=mean(g('A'));
  const B=mean(g('B'));
  const C=mean(g('C'));

  const st=mean([
    ...g('A'),
    ...g('B'),
    ...g('C')
  ]);

  const lv=st<2?0:st<3?1:st<4?2:3;

  const r={
    t:Date.now(),
    A,B,C,st,lv,
    d1:a.D1,
    d2:a.D2,
    d3:a.D3,
    b3:a.B3,
    a1:a.A1,
    e1:a.E1,
    e2:S.e2
  };

  lastE3=S.e3;

  const h=load();
  h.push(r);
  save(h);

  S=null;
  location.hash='#result';
}

const km=(a,b)=>{
  const t=x=>x*Math.PI/180;
  const u=t(b.lat-a.lat);
  const v=t(b.lng-a.lng);
  const h=Math.sin(u/2)**2+
    Math.cos(t(a.lat))*Math.cos(t(b.lat))*Math.sin(v/2)**2;
  return 12742*Math.asin(Math.sqrt(h));
};

const fmt=d=>d<1
  ?Math.round(d*100)*10+'m'
  :d.toFixed(1)+'km';

function parseRaw(t) {
  const db={};
  let gu='';

  t.split('\n').forEach(line=>{
    const l=line.trim();
    if(!l) return;

    const m=l.match(/^(상담|정신과)\s*:\s*(.*)$/);

    if(!m) {
      gu=l.replace(/\s*\([^)]*\)\s*$/,'').trim();
      db[gu]=db[gu]||[];
      return;
    }

    if(!gu) return;

    let depth=0,current='';
    const parts=[];

    for(const ch of m[2]) {
      if(ch==='(') depth++;
      if(ch===')') depth--;

      if(ch===','&&depth===0) {
        parts.push(current);
        current='';
      }
      else {
        current+=ch;
      }
    }

    parts.push(current);

    parts.forEach(item=>{
      const value=item.trim();
      if(!value) return;

      const match=value.match(/^(.*?)\((.*)\)\s*$/);
      const name=(match?match[1]:value).trim();
      const inside=match?match[2]:'';
      const details=inside.split(',').map(x=>x.trim()).filter(Boolean);

      const tel=details.find(x=>/^[\d-]{7,}$/.test(x))||'';
      const note=details.filter(x=>x!==tel).join(', ');

      if(name) db[gu].push({
        gu,
        kind:m[1],
        name,
        tel,
        note
      });
    });
  });

  return db;
}

function loadKakao() {
  if(kakaoP) return kakaoP;

  kakaoP=new Promise((ok,ng)=>{
    const fin=()=>{
      try {
        kakao.maps.load(ok);
      }
      catch(e) {
        ng(e);
      }
    };

    if(window.kakao&&kakao.maps) {
      fin();
      return;
    }

    const s=document.createElement('script');

    s.src='https://dapi.kakao.com/v2/maps/sdk.js?appkey='+
      encodeURIComponent(javascriptKey)+
      '&libraries=services&autoload=false';

    s.onload=fin;
    s.onerror=()=>{
      s.remove();
      ng(new Error('sdk'));
    };

    document.head.appendChild(s);
  });

  kakaoP.catch(()=>{
    kakaoP=null;
  });

  return kakaoP;
}

const tail=x=>String(x||'').replace(/\D/g,'').slice(-8);
const nm=x=>String(x||'').replace(/\s/g,'').toLowerCase();

const find=(ps,p)=>new Promise(res=>{
  ps.keywordSearch('서울 '+p.gu+' '+p.name,(d,s)=>{
    if(s!==kakao.maps.services.Status.OK) {
      res(null);
      return;
    }

    const h=d.find(r=>
      tail(p.tel).length===8
        ?tail(r.phone)===tail(p.tel)
        :nm(r.place_name)===nm(p.name)&&
         String(r.address_name).includes(p.gu)
    );

    res(h?{
      lat:+h.y,
      lng:+h.x,
      addr:h.road_address_name||h.address_name,
      tel:h.phone||p.tel
    }:null);
  },{size:5});
});

        지도: Kakao 지도 · 장소 정보:
        ${demo
          ?'연습용 가상 데이터(실제 자료 아님)'
          :'팀이 모은 목록, 위치는 카카오맵 장소 검색으로 확인'}
      </p>
    </div>

    <div class="card">
      <h2>장소 목록</h2>
      <p id="gmsg" class="sub">
        ${demo?'':'구를 선택하면 상담센터와 정신건강의학과를 보여줘요.'}
      </p>
      <ul class="plist" id="plist"></ul>
    </div>

    <details class="card">
      <summary>지도가 안 보이면 확인해 보세요</summary>
      <ol>
        <li>
          카카오 개발자 콘솔에서 이 키가 속한 앱의
          <b>카카오맵 사용 설정이 ON</b>인지 확인해요.
        </li>
        <li>
          코드의 <b>javascriptKey</b>에 같은 앱의
          <b>JavaScript 키</b>(REST 키 아님)를 넣었는지 확인해요.
        </li>
        <li>
          앱 키의 <b>JavaScript SDK 도메인</b>에
          지금 이 사이트 주소의 프로토콜·호스트·포트를
          등록했는지 확인해요.
          지금 주소: <b>${esc(origin)}</b>
        </li>
        ${location.protocol==='file:'
          ?`<li>
              <b>파일을 더블클릭해서 연 상태</b>에서는
              등록할 도메인이 없어 지도가 안 뜰 수 있어요.
              localhost 서버나 배포 주소로 열어 보세요.
            </li>`
          :''}
        <li>
          광고 차단·보안 프로그램이 dapi.kakao.com을
          막고 있지 않은지 확인해요.
        </li>
      </ol>
    </details>
  `;

  const $=id=>document.getElementById(id);

  const st=(t,bad)=>{
    const e=$('kstate');
    if(e) {
      e.textContent=t;
      e.hidden=!t;
      e.classList.toggle('bad',!!bad);
    }
  };

  const msg=t=>{
    const e=$('locmsg');
    if(e) e.textContent=t;
  };

  const setG=t=>{
    const e=$('gmsg');
    if(e) e.textContent=t;
  };

  const renderList=()=>{
    const ord=items.map((p,i)=>i);

    if(myPos) {
      items.forEach(p=>{
        p.d=p.lat!=null?km(myPos,p):null;
      });

      ord.sort((a,b)=>
        (items[a].d==null?1e9:items[a].d)-
        (items[b].d==null?1e9:items[b].d)
      );
    }

    const ul=$('plist');

    if(ul) {
      ul.innerHTML=ord.map(i=>{
        const p=items[i];
        const ok=p.lat!=null;

        return `
          <li>
            <button class="pl"
              data-i="${i}"
              ${ok?'':'disabled'}>
              ${esc(p.name)}
              ${p.d!=null?' · 약 '+fmt(p.d):''}

              <span class="sub">
                ${esc(p.kind)}
                ${p.practice
                  ?'가상 연습 위치 · 실제 자료 아님'
                  :ok
                    ?(p.addr?' · '+esc(p.addr):'')
                    :' · 지도 위치를 확인하지 못했어요'}
                ${p.note?' · '+esc(p.note):''}
              </span>
            </button>

            ${p.tel
              ?`<a class="tel" href="tel:${p.tel.replace(/[^\d+]/g,'')}">
                  ${esc(p.tel)}
                </a>
                ${ok||p.practice
                  ?''
                  :'<span class="sub"> (전화번호 확인 필요)</span>'}`
              :'<span class="sub tel">전화번호 정보 없음</span>'
            }
          </li>
        `;
      }).join('');
    }
  };

  renderList();

  $('plist').onclick=e=>{
    const b=e.target.closest('.pl');
    if(b&&ctl) ctl.pick(+b.dataset.i);
  };

  const loadGu=async g=>{
    gu=g;
    items=(DB[g]||[]).map(x=>({...x}));

    renderList();

    if(ctl) ctl.set();

    if(!g) {
      setG('구를 선택하면 상담센터와 정신건강의학과를 보여줘요.');
      return;
    }

    setG('위치를 확인하는 중이에요…');

    try {
      await ready();

      const ps=new kakao.maps.services.Places();

      await Promise.all(items.map(async p=>{
        const k=g+'|'+p.name;

        if(!(k in CACHE)) {
          CACHE[k]=await find(ps,p);
        }

        if(CACHE[k]) {
          Object.assign(p,CACHE[k]);
        }
      }));
    }
    catch(e) {
      setG('지도 서비스를 불러오지 못해 목록만 보여드려요.');
      renderList();
      return;
    }

    if(gu!==g) return;

    setG(
      items.length+'곳 중 '+
      items.filter(p=>p.lat!=null).length+
      '곳을 지도에서 확인했어요. 나머지는 연락처만 보여드려요.'
    );

    renderList();

    if(ctl) ctl.set();
  };

  if(!demo) {
    $('gu').onchange=e=>loadGu(e.target.value);
  }

  const pickGu=async()=>{
    try {
      await ready();

      const r=await new Promise(res=>
        new kakao.maps.services.Geocoder()
          .coord2RegionCode(
            myPos.lng,
            myPos.lat,
            (d,s)=>res(
              s===kakao.maps.services.Status.OK?d:[]
            )
          )
      );

      const g=(r[0]||{}).region_2depth_name;

      if(!g) return;

      if(DB[g]) {
        if(g!==gu) {
          $('gu').value=g;
          await loadGu(g);
        }
      }
      else {
        setG(
          '지금 있는 지역('+g+')의 목록은 아직 준비되지 않았어요. 구를 직접 골라 보세요.'
        );
      }
    }
    catch(e) {}
  };

  $('loc').onclick=()=>{
    if(!navigator.geolocation||!window.isSecureContext) {
      msg('이 주소에서는 위치 기능을 쓸 수 없어요. https 주소나 localhost에서 열어 주세요.');
      return;
    }

    msg('내 위치를 확인하는 중이에요…');

    navigator.geolocation.getCurrentPosition(
      async pos=>{
        myPos={
          lat:pos.coords.latitude,
          lng:pos.coords.longitude
        };

        renderList();

        if(ctl) ctl.me();

        if(!demo) await pickGu();

        const pl=items.filter(p=>p.d!=null);

        msg(
          pl.length
            ?'가장 가까운 곳: '+
              pl.reduce((a,p)=>p.d<a.d?p:a).name+
              ' 약 '+fmt(Math.min(...pl.map(p=>p.d)))
            :'내 위치를 찾았어요.'
        );
      },
      err=>msg(
        err.code===1
          ?'위치 사용이 허용되지 않았어요. 브라우저 주소창에서 위치 권한을 허용으로 바꿔 주세요.'
          :err.code===3
            ?'위치를 확인하는 데 시간이 너무 오래 걸렸어요. 다시 눌러 주세요.'
            :'지금은 위치를 확인할 수 없어요. 잠시 뒤 다시 시도해 주세요.'
      ),
      {
        enableHighAccuracy:true,
        timeout:10000,
        maximumAge:60000
      }
    );
  };

  if(!keyOk()) {
    st(
      '지도를 쓰려면 카카오 JavaScript 키 설정이 필요해요. 코드 위쪽의 javascriptKey 값을 바꿔 주세요. (목록은 그대로 볼 수 있어요)',
      1
    );
    return;
  }

  ready().then(()=>{
    const c=$('kakao-map');
    if(!c) return;

    const m=new kakao.maps.Map(c,{
      center:new kakao.maps.LatLng(37.5665,126.9780),
      level:7
    });

    const iw=new kakao.maps.InfoWindow({removable:true});

    let marks=[],bnd=null,meOv=null;

    const show=(p,mk)=>{
      iw.setContent(`
        <div style="padding:8px 10px;font-size:13px;line-height:1.5;min-width:170px">
          <b>${esc(p.name)}</b><br>
          ${p.practice
            ?'가상 연습 위치 · 실제 자료 아님'
            :esc([p.addr||p.address,p.tel].filter(Boolean).join(' · '))
          }
        </div>
      `);

      iw.open(m,mk);
      m.panTo(mk.getPosition());
    };

    const fit=()=>{
      if(!c.isConnected) return;

      m.relayout();

      if(myPos) {
        ctl.me();
      }
      else if(marks.length>1) {
        m.setBounds(bnd,40,40,40,40);
      }
      else if(marks.length===1) {
        m.setCenter(marks[0].getPosition());
        m.setLevel(3);
      }
    };

    ctl={
      set:()=>{
        marks.forEach(k=>k.setMap(null));

        marks=[];
        bnd=new kakao.maps.LatLngBounds();

        items.forEach(p=>{
          if(p.lat==null) return;

          const pos=new kakao.maps.LatLng(p.lat,p.lng);

          bnd.extend(pos);

          const mk=new kakao.maps.Marker({
            map:m,
            position:pos,
            title:p.name
          });

          kakao.maps.event.addListener(mk,'click',()=>{
            show(p,mk);
          });

          p.mk=mk;
          marks.push(mk);
        });

        fit();
      },

      pick:i=>{
        const p=items[i];

        if(p&&p.mk) {
          show(p,p.mk);

          c.scrollIntoView({
            behavior:'smooth',
            block:'center'
          });
        }
      },

      me:()=>{
        const pos=new kakao.maps.LatLng(
          myPos.lat,
          myPos.lng
        );

        if(meOv) meOv.setMap(null);

        meOv=new kakao.maps.CustomOverlay({
          position:pos,
          content:'<div class="medot" title="내 위치"></div>',
          xAnchor:.5,
          yAnchor:.5
        });

        meOv.setMap(m);

        const near=items
          .filter(p=>p.mk&&p.d!=null)
          .sort((a,b)=>a.d-b.d)[0];

        if(near) {
          const bb=new kakao.maps.LatLngBounds();

          bb.extend(pos);
          bb.extend(near.mk.getPosition());

          m.setBounds(bb,60,60,60,60);
        }
        else {
          m.setCenter(pos);
        }
      }
    };

    ctl.set();
    st('');

    if(window.ResizeObserver) {
      kro=new ResizeObserver(()=>{
        if(c.isConnected) m.relayout();
      });

      kro.observe(c);
    }

    setTimeout(fit,450);

  }).catch(()=>{
    st(
      '지도를 불러오지 못했어요. 아래 "지도가 안 보이면 확인해 보세요"를 확인해 주세요. (목록은 그대로 볼 수 있어요)',
      1
    );
  });
}


// 화면 이동
const routes={
  home,
  test,
  result,
  map
};

function go() {
  const r=(location.hash||'#home').slice(1);

  (routes[r]||home)();

  document.querySelectorAll('.nav a').forEach(a=>{
    a.classList.toggle('on',a.hash==='#'+r);
  });

  scrollTo(0,0);
  anim(1);
}


// 저장된 테마 자동 적용 및 플로팅 테마 선택기
applyTheme(getTheme(),false);

const themeLauncher=document.getElementById('theme-launcher');
const themePanel=document.getElementById('theme-panel');
const closeThemePanel=()=>{
  themePanel.hidden=true;
  themeLauncher.setAttribute('aria-expanded','false');
};
themeLauncher.addEventListener('click',()=>{
  const opening=themePanel.hidden;
  themePanel.hidden=!opening;
  themeLauncher.setAttribute('aria-expanded',String(opening));
});
document.getElementById('theme-close').addEventListener('click',closeThemePanel);
// 각 팔레트 버튼에 직접 이벤트를 연결해 클릭 대상에 관계없이 전환되도록 처리
themePanel.querySelectorAll('.palette-choice[data-theme]').forEach(choice=>{
  choice.addEventListener('click',e=>{
    e.preventDefault();
    e.stopPropagation();
    applyTheme(choice.dataset.theme);
    closeThemePanel();
  });
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!themePanel.hidden) closeThemePanel();
});
document.addEventListener('click',e=>{
  if(!themePanel.hidden&&!themePanel.contains(e.target)&&!themeLauncher.contains(e.target)){
    closeThemePanel();
  }
});

addEventListener('hashchange',go);


// 통계 데이터 적용
try {
  stats=DATA;

  const m=stats.stress.meta;
  const e=stats.effort.meta;

  document.getElementById('src').textContent=
    `통계 출처: ${m.source} (KOSIS ${m.id}, ${e.id}) · 기준 시점: ${m.period.replace('[3년] ','')}년 · 다운로드 ${m.downloaded.slice(0,10)}`;
}
catch(x) {
  const e=document.getElementById('err');

  e.hidden=false;

  e.textContent=
    '통계 데이터를 불러오지 못했어요. 코드의 DATA 부분이 손상되지 않았는지 확인해 주세요. 자가진단과 채점은 계속 쓸 수 있어요.';
}


// 하단 메뉴
document.querySelector('.nav').innerHTML=[
  ['home','홈'],
  ['test','진단'],
  ['result','결과'],
  ['map','지도']
].map(([k,t])=>
  `<a href="#${k}">${ico(k)}<span>${t}</span></a>`
).join('');

go();

</script>
